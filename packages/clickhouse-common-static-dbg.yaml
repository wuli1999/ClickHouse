# package sources should be placed in ${PWD}/root
# nfpm should run from the same directory with a config
name: "vxdfs-common-static-dbg"
description: |
  debugging symbols for vxdfs-common-static
    This package contains the debugging symbols for vxdfs-common.


#
# Common packages config
arch: "${DEB_ARCH}" # amd64, arm64
platform: "linux"
version: "${CLICKHOUSE_VERSION_STRING}"
vendor: "vxdfs"
homepage: ""
license: "Apache"
section: "storage"
priority: "optional"
maintainer: "vxdfs"
deb:
  fields:
    Source: vxdfs

# Package specific content
replaces:
- vxdfs-common-dbg
conflicts:
- vxdfs-common-dbg

contents:
- src: root/usr/lib/debug/usr/bin/vxdfs.debug
  dst: /usr/lib/debug/usr/bin/vxdfs.debug
- src: root/usr/lib/debug/usr/bin/vxdfs-odbc-bridge.debug
  dst: /usr/lib/debug/usr/bin/vxdfs-odbc-bridge.debug
- src: root/usr/lib/debug/usr/bin/vxdfs-library-bridge.debug
  dst: /usr/lib/debug/usr/bin/vxdfs-library-bridge.debug
# docs
#- src: ../AUTHORS
#  dst: /usr/share/doc/vxdfs-common-static-dbg/AUTHORS
#- src: ../CHANGELOG.md
#  dst: /usr/share/doc/vxdfs-common-static-dbg/CHANGELOG.md
#- src: ../LICENSE
#  dst: /usr/share/doc/vxdfs-common-static-dbg/LICENSE
#- src: ../README.md
#  dst: /usr/share/doc/vxdfs-common-static-dbg/README.md
