# package sources should be placed in ${PWD}/root
# nfpm should run from the same directory with a config
name: "vxdfs-common-static"
description: |
  Common files for vxdfs
    vxdfs is a high performence distributed file system.
    This package provides common files for both vxdfs server and client

# Common packages config
arch: "${DEB_ARCH}" # amd64, arm64
platform: "linux"
version: "${CLICKHOUSE_VERSION_STRING}"
vendor: "vxdfs"
homepage: ""
license: "Apache"
section: "storage"
priority: "optional"
maintainer: "vxdfs"
deb:
  fields:
    Source: vxdfs

# Package specific content
replaces:
- vxdfs-common
- vxdfs-server-base
provides:
- vxdfs-common
- vxdfs-server-base
#suggests:
#- vxdfs-common-static-dbg

contents:
- src: root/usr/bin/vxdfs
  dst: /usr/bin/vxdfs

- src: vxdfs
  dst: /usr/bin/vxdfs-extract-from-config
  type: symlink
- src: root/usr/bin/vxdfs-library-bridge
  dst: /usr/bin/vxdfs-library-bridge

- src: root/usr/bin/vxdfs-odbc-bridge
  dst: /usr/bin/vxdfs-odbc-bridge

- src: root/usr/share/bash-completion/completions
  dst: /usr/share/bash-completion/completions

- src: vxdfs
  dst: /usr/share/vxdfs
  type: symlink
# docs
#- src: ../AUTHORS
#  dst: /usr/share/doc/vxdfs-common-static/AUTHORS
#- src: ../CHANGELOG.md
#  dst: /usr/share/doc/vxdfs-common-static/CHANGELOG.md
#- src: ../LICENSE
#  dst: /usr/share/doc/vxdfs-common-static/LICENSE
#- src: ../README.md
#  dst: /usr/share/doc/vxdfs-common-static/README.md
