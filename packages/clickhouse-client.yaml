# package sources should be placed in ${PWD}/root
# nfpm should run from the same directory with a config
name: "vxdfs-client"
description: |
  Client binary for vxdfs
    vxdfs is a high performence distributed file system.
    This package provides vxdfs-client, vxdfs-local and vxdfs-benchmark.

# Common packages config
arch: "${DEB_ARCH}" # amd64, arm64
platform: "linux"
version: "${CLICKHOUSE_VERSION_STRING}"
vendor: "vxdfs"
homepage: ""
license: "Apache"
section: "storage"
priority: "optional"
maintainer: "vxdfs"
deb:
  fields:
    Source: vxdfs

# Package specific content
replaces:
- vxdfs-compressor
conflicts:
- vxdfs-compressor

overrides:
  deb:
    depends:
    - vxdfs-common-static (= ${CLICKHOUSE_VERSION_STRING})
  rpm:
    depends:
    - vxdfs-common-static = ${CLICKHOUSE_VERSION_STRING}

contents:
- src: root/etc/vxdfs-client/config.xml
  dst: /etc/vxdfs-client/config.xml
  type: config|noreplace

- src: vxdfs
  dst: /usr/bin/vxdfs-benchmark
  type: symlink

- src: vxdfs
  dst: /usr/bin/vxdfs-compressor
  type: symlink

- src: vxdfs
  dst: /usr/bin/vxdfs-format
  type: symlink

- src: vxdfs
  dst: /usr/bin/vxdfs-client
  type: symlink
  
- src: vxdfs
  dst: /usr/bin/vxdfs-local
  type: symlink
#- src: root/usr/bin/ch
  #dst: /usr/bin/ch
#- #src: root/usr/bin/chc
  #dst: /usr/bin/chc
#- #src: root/usr/bin/chl
  #dst: /usr/bin/chl
- src: vxdfs
  dst: /usr/bin/vxdfs-obfuscator
  type: symlink
# docs
#- #src: ../AUTHORS
  #dst: /usr/share/doc/vxdfs-client/AUTHORS
#- #src: ../CHANGELOG.md
  #dst: /usr/share/doc/vxdfs-client/CHANGELOG.md
#- #src: ../LICENSE
  #dst: /usr/share/doc/vxdfs-client/LICENSE
#- #src: ../README.md
  #dst: /usr/share/doc/vxdfs-client/README.md
