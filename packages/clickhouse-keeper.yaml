# package sources should be placed in ${PWD}/root
# nfpm should run from the same directory with a config
name: "vxdfs-keeper"
description: |
  Static vxdfs-keeper binary
    A stand-alone vxdfs-keeper package


#
# Common packages config
arch: "${DEB_ARCH}" # amd64, arm64
platform: "linux"
version: "${CLICKHOUSE_VERSION_STRING}"
vendor: "vxdfs"
homepage: ""
license: "Apache"
section: "storage"
priority: "optional"
maintainer: "vxdfs"
deb:
  fields:
    Source: vxdfs

# Package specific content
conflicts:
- vxdfs-server
#suggests:
#- vxdfs-keeper-dbg

contents:
- src: root/etc/vxdfs-keeper/keeper_config.xml
  dst: /etc/vxdfs-keeper/keeper_config.xml
  type: config|noreplace
- src: vxdfs-keeper.service
  dst: /lib/systemd/system/vxdfs-keeper.service

- src: root/usr/bin/vxdfs
  dst: /usr/bin/vxdfs-keeper

- src: vxdfs-keeper
  dst: /usr/bin/vxdfs-keeper-client
  type: symlink
  
- src: vxdfs-keeper
  dst: /usr/bin/vxdfs-keeper-converter
  type: symlink
# docs
#- src: ../AUTHORS
#  dst: /usr/share/doc/vxdfs-keeper/AUTHORS
#- src: ../CHANGELOG.md
#  dst: /usr/share/doc/vxdfs-keeper/CHANGELOG.md
#- src: ../LICENSE
#  dst: /usr/share/doc/vxdfs-keeper/LICENSE
#- src: ../README.md
#  dst: /usr/share/doc/vxdfs-keeper/README.md

scripts:
  postinstall: ./vxdfs-keeper.postinstall
