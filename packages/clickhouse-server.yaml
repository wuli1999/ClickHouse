# package sources should be placed in ${PWD}/root
# nfpm should run from the same directory with a config
name: "vxdfs-server"
description: |
  Server binary for vxdfs
    vxdfs is a high performence distributed file system.
    This package provides clickhouse common configuration files

# Common packages config
arch: "${DEB_ARCH}" # amd64, arm64
platform: "linux"
version: "${CLICKHOUSE_VERSION_STRING}"
vendor: "vxdfs"
homepage: ""
license: "Apache"
section: "storage"
priority: "optional"
maintainer: "vxdfs"
deb:
  fields:
    Source: vxdfs

# Package specific content
replaces:

provides:
- vxdfs-keeper

recommends:
- libcap2-bin

overrides:
  deb:
    depends:
    - vxdfs-common-static (= ${CLICKHOUSE_VERSION_STRING})
  rpm:
    depends:
    - vxdfs-common-static = ${CLICKHOUSE_VERSION_STRING}

contents:
- src: root/etc/vxdfs-server/config.xml
  dst: /etc/vxdfs-server/config.xml
  type: config|noreplace
- src: root/etc/vxdfs-server/users.xml
  dst: /etc/vxdfs-server/users.xml
  type: config|noreplace
- src: vxdfs-server.init
  dst: /etc/init.d/vxdfs-server
- src: vxdfs-server.service
  dst: /lib/systemd/system/vxdfs-server.service

- src: vxdfs
  dst: /usr/bin/vxdfs-server
  type: symlink

# vxdfs-keeper part
- src: root/etc/vxdfs-keeper/keeper_config.xml
  dst: /etc/vxdfs-keeper/keeper_config.xml
  type: config|noreplace
- src: vxdfs-keeper.service
  dst: /lib/systemd/system/vxdfs-keeper.service
- src: vxdfs
  dst: /usr/bin/vxdfs-keeper
  type: symlink

- src: vxdfs
  dst: /usr/bin/vxdfs-keeper-client
  type: symlink
  
- src: vxdfs
  dst: /usr/bin/vxdfs-keeper-converter
  type: symlink
# docs
#- src: ../AUTHORS
#  dst: /usr/share/doc/vxdfs-server/AUTHORS
#- src: ../CHANGELOG.md
#  dst: /usr/share/doc/vxdfs-server/CHANGELOG.md
#- src: ../LICENSE
#  dst: /usr/share/doc/vxdfs-server/LICENSE
#- src: ../README.md
#  dst: /usr/share/doc/vxdfs-server/README.md

scripts:
  postinstall: ./vxdfs-server.postinstall
