# package sources should be placed in ${PWD}/root
# nfpm should run from the same directory with a config
name: "vxdfs-keeper-dbg"
description: |
  debugging symbols for vxdfs-keeper
    This package contains the debugging symbols for vxdfs-keeper.


#
# Common packages config
arch: "${DEB_ARCH}" # amd64, arm64
platform: "linux"
version: "${CLICKHOUSE_VERSION_STRING}"
vendor: "vxdfs"
homepage: ""
license: "Apache"
section: "storage"
priority: "optional"
maintainer: "vxdfs"
deb:
  fields:
    Source: vxdfs

# Package specific content
contents:
- src: root/usr/lib/debug/usr/bin/vxdfs-keeper.debug
  dst: /usr/lib/debug/usr/bin/vxdfs-keeper.debug
